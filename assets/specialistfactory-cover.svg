<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" fill="none" preserveAspectRatio="xMidYMid meet">
  <rect width="1280" height="800" fill="#E8EBF0"/>
  <defs>
    <pattern id="sf-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(18,24,32,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="800" fill="url(#sf-grid)"/>

  <!-- Brand mark -->
  <rect x="96" y="88" width="56" height="56" rx="6" fill="#121820"/>
  <text x="124" y="124" text-anchor="middle" fill="#FFFFFF" font-family="Syne, Arial Narrow, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.04em">SF</text>
  <text x="172" y="112" fill="#121820" font-family="Syne, Arial Narrow, sans-serif" font-size="28" font-weight="800">Specialist Factory</text>
  <text x="172" y="142" fill="#5C667A" font-family="IBM Plex Sans, Helvetica Neue, sans-serif" font-size="16">Task models under your agent</text>

  <!-- Stack diagram -->
  <g font-family="IBM Plex Sans, Helvetica Neue, sans-serif">
    <rect x="96" y="220" width="640" height="72" rx="8" fill="#FFFFFF" stroke="#C5CCD8"/>
    <text x="120" y="264" fill="#121820" font-size="22" font-weight="700">Your agent / harness</text>

    <text x="120" y="330" fill="#5C667A" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14"> calls</text>
    <text x="120" y="352" fill="#5C667A" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">¼</text>

    <rect x="96" y="368" width="640" height="96" rx="8" fill="#DCE7FA" stroke="#1A4FC4" stroke-width="2"/>
    <rect x="96" y="368" width="8" height="96" rx="2" fill="#1A4FC4"/>
    <text x="128" y="410" fill="#1A4FC4" font-size="22" font-weight="700">Task model</text>
    <text x="128" y="442" fill="#2A3340" font-size="16">Open weights + your labeled outcomes · one scoped job</text>

    <text x="120" y="508" fill="#5C667A" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14"> runs on</text>
    <text x="120" y="530" fill="#5C667A" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14">¼</text>

    <rect x="96" y="548" width="196" height="72" rx="8" fill="#FFFFFF" stroke="#C5CCD8"/>
    <text x="116" y="580" fill="#121820" font-size="15" font-weight="700">Shared</text>
    <text x="116" y="604" fill="#5C667A" font-size="13">Pilot</text>

    <rect x="308" y="548" width="196" height="72" rx="8" fill="#FFFFFF" stroke="#C5CCD8"/>
    <text x="328" y="580" fill="#121820" font-size="15" font-weight="700">Your cloud</text>
    <text x="328" y="604" fill="#5C667A" font-size="13">BYOC</text>

    <rect x="520" y="548" width="216" height="72" rx="8" fill="#FFFFFF" stroke="#C5CCD8"/>
    <text x="540" y="580" fill="#121820" font-size="15" font-weight="700">Confidential GPU</text>
    <text x="540" y="604" fill="#5C667A" font-size="13">Attested TEEs</text>
  </g>

  <!-- Side panel -->
  <rect x="800" y="220" width="384" height="400" rx="12" fill="#121820"/>
  <text x="832" y="272" fill="#A9B6CC" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" letter-spacing="0.12em">KEEP THE AGENT</text>
  <text x="832" y="320" fill="#FFFFFF" font-family="Syne, Arial Narrow, sans-serif" font-size="28" font-weight="800">Swap the weak link.</text>
  <text x="832" y="368" fill="#A9B6CC" font-family="IBM Plex Sans, Helvetica Neue, sans-serif" font-size="16">Frontier stays for open-ended work. The high-volume loop gets a task model underneath.</text>

  <rect x="832" y="420" width="320" height="1" fill="#2A3340"/>
  <text x="832" y="468" fill="#9AD9C3" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">beat-frontier on held-out labels</text>
  <text x="832" y="508" fill="#D7E0EF" font-family="IBM Plex Sans, Helvetica Neue, sans-serif" font-size="15">Fraud · triage · routing · review</text>
  <text x="832" y="548" fill="#5C667A" font-family="IBM Plex Sans, Helvetica Neue, sans-serif" font-size="14">Pilot includes training credits.</text>
</svg>
