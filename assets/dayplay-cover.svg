<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" fill="none" preserveAspectRatio="xMidYMid meet">
  <rect width="1280" height="800" fill="#0C0A09"/>
  <defs>
    <pattern id="dp-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,87,34,0.07)" stroke-width="1"/>
    </pattern>
    <radialGradient id="dp-glow" cx="70%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FF5722" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#FF5722" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dp-console" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1614"/>
      <stop offset="100%" stop-color="#12100E"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#dp-grid)" opacity="0.9"/>
  <circle cx="920" cy="300" r="360" fill="url(#dp-glow)"/>
  <circle cx="200" cy="620" r="200" fill="rgba(34,197,94,0.05)"/>

  <!-- Symmetric 4-point star (dayplay.io mark), scaled -->
  <path
    transform="translate(210 340) scale(15)"
    d="M0-10l2.4 7.2L10 0l-7.6 2.8L0 10l-2.4-7.2L-10 0l7.6-2.8Z"
    fill="#FF5722"
  />
  <text x="96" y="580" fill="#FAFAF9" font-family="Syne, Arial Narrow, sans-serif" font-size="42" font-weight="700">Dayplay</text>
  <text x="96" y="620" fill="#A8A29E" font-family="IBM Plex Sans, Helvetica Neue, sans-serif" font-size="18">Local intelligence engine - agent MCP</text>

  <rect x="520" y="130" width="660" height="540" rx="28" fill="url(#dp-console)" stroke="rgba(255,87,34,0.35)" stroke-width="2"/>
  <rect x="520" y="130" width="660" height="56" rx="28" fill="#151210"/>
  <rect x="520" y="170" width="660" height="16" fill="#151210"/>
  <text x="552" y="166" fill="#A8A29E" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="16" font-weight="500" letter-spacing="0.12em">ENGINE CONSOLE</text>
  <text x="1140" y="166" fill="#FF5722" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="14" text-anchor="end">api.dayplay.io/mcp</text>

  <g font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13" fill="#D6D3D1">
    <rect x="556" y="230" width="140" height="36" rx="8" fill="#1F1A17" stroke="rgba(255,87,34,0.25)"/>
    <text x="572" y="253"><tspan fill="#FF5722">01</tspan> Intent</text>
    <text x="710" y="253" fill="#57534E">&gt;</text>
    <rect x="732" y="230" width="156" height="36" rx="8" fill="#1F1A17" stroke="rgba(255,87,34,0.25)"/>
    <text x="748" y="253"><tspan fill="#FF5722">02</tspan> Centroid</text>
    <text x="902" y="253" fill="#57534E">&gt;</text>
    <rect x="924" y="230" width="120" height="36" rx="8" fill="#1F1A17" stroke="rgba(255,87,34,0.45)"/>
    <text x="940" y="253"><tspan fill="#FF5722">03</tspan> MCP</text>
  </g>

  <rect x="556" y="300" width="520" height="280" rx="16" fill="#0C0A09" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="580" cy="332" r="5" fill="#22C55E"/>
  <text x="596" y="337" fill="#A8A29E" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="13">LIVE - SF - OAK - BER</text>
  <text x="580" y="400" fill="#FAFAF9" font-family="Syne, Arial Narrow, sans-serif" font-size="28" font-weight="700">Verified spatial graph</text>
  <text x="580" y="440" fill="#A8A29E" font-family="IBM Plex Sans, Helvetica Neue, sans-serif" font-size="16">40 tools - zero hallucinations - dual handoff</text>
  <rect x="580" y="490" width="180" height="34" rx="8" fill="rgba(255,87,34,0.15)" stroke="#FF5722"/>
  <text x="670" y="512" fill="#FF5722" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" text-anchor="middle">get_happening_today</text>
  <rect x="780" y="490" width="96" height="34" rx="8" fill="#1F1A17" stroke="rgba(255,255,255,0.1)"/>
  <text x="828" y="512" fill="#D6D3D1" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="12" text-anchor="middle">35 nodes</text>
</svg>
